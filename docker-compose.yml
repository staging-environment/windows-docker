version: '3'

services:
  windows:
    image: dockurr/windows
    container_name: ddev-utrecar-windows  # Siguiendo tu nomenclatura
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"   # Interfaz Web (Escritorio en el navegador)
      - "3389:3389/tcp" # Escritorio Remoto (RDP)
      - "3389:3389/udp"
    environment:
      VERSION: "tiny11" # Te recomiendo 'tiny11' para que vuele en el server
      RAM_SIZE: "4G"
      CPU_CORES: "2"
    networks:
      - ddev_default  # <--- IMPORTANTE: Se une a la red de tus otros contenedores
    restart: on-failure

networks:
  ddev_default:
    external: true    # Le decimos que use la red que ya creó DDEV
