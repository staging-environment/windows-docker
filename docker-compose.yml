services:
  windows:
    image: dockurr/windows
    container_name: ddev-utrecar-windows
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - win_storage:/storage
    environment:
      VERSION: "win10"
      RAM_SIZE: "16G"
      CPU_CORES: "6"
    networks:
      - ddev_default
    restart: on-failure

volumes:
  win_storage:
    external: true
    name: 345c268d436ece3c5add6cd1355326c51a49206c50d6c4d900833f215af7a739

networks:
  ddev_default:
    external: true
