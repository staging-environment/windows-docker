version: '3'

services:
  windows:
    image: dockurr/windows
    container_name: ddev-utrecar-windows
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    environment:
      VERSION: "tiny11"
      RAM_SIZE: "16G"
      CPU_CORES: "6"
    networks:
      - ddev_default
    restart: on-failure

networks:
  ddev_default:
    external: true
